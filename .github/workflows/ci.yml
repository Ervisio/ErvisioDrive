name: Validate ErvisioDrive
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
        env:
          MONGOMS_DISABLE_POSTINSTALL: "1"
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - run: npm run test:http
      - name: Install isolated UI test browser
        run: npx playwright install --with-deps chromium
      - name: Verify phone, tablet and desktop flows
        run: npm run test:ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: responsive-ui-evidence
          path: |
            test-results/
            playwright-report/
          retention-days: 7
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate launcher syntax
        run: bash -n setup.sh
      - name: Build and start stack through setup.sh
        run: ./setup.sh --non-interactive --admin-email ci@example.com --quota 1
      - name: Check readiness and access protection
        run: |
          curl --fail http://localhost:3000/api/health
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/api/admin/members)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/api/admin/cdn/files)" = 401
      - name: Resize and preserve existing storage
        run: |
          ./setup.sh --non-interactive --resize 2
          curl --fail http://localhost:3000/api/health
      - if: failure()
        run: docker compose logs --no-color app mongo cleanup
      - if: always()
        run: docker compose down -v
  plugin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run pack
