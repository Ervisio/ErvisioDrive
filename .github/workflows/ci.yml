name: Validate ErvisioDrive
on: [push, pull_request]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
        env:
          MONGOMS_DISABLE_POSTINSTALL: "1"
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - run: npm run test:http
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure disposable installation
        run: docker run --rm -v "$PWD:/project" -w /project node:22-bookworm-slim node scripts/setup.mjs --non-interactive --admin-email ci@example.com --quota 1
      - name: Build and start stack
        run: docker compose up -d --build --wait --wait-timeout 240
      - name: Check readiness and access protection
        run: |
          curl --fail http://localhost:3000/api/health
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/api/admin/members)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/api/admin/cdn/files)" = 401
      - name: Resize and preserve existing storage
        run: |
          docker run --rm -v "$PWD:/project" -w /project node:22-bookworm-slim node scripts/setup.mjs --non-interactive --resize 2
          docker compose up -d --wait --wait-timeout 120
          curl --fail http://localhost:3000/api/health
      - if: failure()
        run: docker compose logs --no-color app mongo cleanup
      - if: always()
        run: docker compose down -v
